name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'ci' }}
  WINDOWS_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0' }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install ffmpeg -y --no-progress

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Verify Python sources
        run: python -m compileall app extractors scripts

      - name: Build package
        run: |
          python scripts/build_ci.py --platform "${{ runner.os }}" --version "${{ env.WINDOWS_VERSION }}" --package-version "${{ env.PACKAGE_VERSION }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Battlezone_PSPExtractor-${{ runner.os }}
          path: release/Battlezone_PSPExtractor-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/Battlezone_PSPExtractor-v*-windows.zip
